<!doctype html><meta charset="utf-8"><title>SushiTV — animaciones secretas</title>
<style>body{font:14px system-ui;background:#16110d;color:#f3e6d6;margin:0;padding:12px}canvas{width:100%;aspect-ratio:16/9;border-radius:12px;display:block}
button{font:14px system-ui;margin:4px 4px 4px 0;padding:6px 12px;border-radius:8px;border:1px solid #8B5A3C;background:#2a1f18;color:#f3e6d6;cursor:pointer}#st{opacity:.8;margin-left:8px}</style>
<canvas id="c"></canvas>
<div id="btns"><button data-a="0">La caja</button><button data-a="1">Puntero láser</button><button data-a="2">La siesta</button><button data-a="3">Lluvia de sushi</button><button data-a="r">🎲 Sorpresa</button><span id="st"></span></div>
<script src="synth.js"></script>
<script src="secretos.js"></script>
<script>
// Sushi's little sounds (from audios/a..d.ogg, the same moments the welcome uses).
const CHIRP={1:{f:'a',s:1.14,e:1.70},2:{f:'b',s:1.22,e:1.66},4:{f:'b',s:4.50,e:4.84},5:{f:'b',s:6.24,e:6.56},7:{f:'c',s:2.80,e:3.18},8:{f:'d',s:1.24,e:1.82}};
const SR=22050,OUT_SR=48000;
// Each soundtrack: music and effects from synth.js + [chirp id, second] pairs.
const SOUND=[
 function box(){const d=7.2,y=Synth(d,SR);
   y.noise(0.0,0.6,0.35,0.15);y.bass(0.62,mf(36),0.35);y.noise(0.62,0.08,0.4,0.3);
   [60,63,67,63,60,63,67,70].forEach((m,i)=>y.pizz(0.8+i*0.25,mf(m+12),0.16));[0.8,1.3,1.8,2.3].forEach((t,i)=>y.bass(t,mf(i%2?43:36),0.16,0.35));
   y.pluck(1.45,mf(96),0.08,0.3);y.pluck(1.95,mf(91),0.08,0.3);
   y.glide(2.4,0.25,900,300,0.1);
   for(let t=2.7;t<3.6;t+=0.07)y.noise(t,0.05,0.22,0.5);
   y.glide(3.6,0.45,400,1200,0.12);y.boing(3.6,0.6,300,0.1);y.noise(3.6,0.9,0.25,0.7);
   y.bass(4.7,mf(38),0.3);y.noise(4.7,0.08,0.3,0.3);
   [72,76,79,76,74,77,79,77].forEach((m,i)=>y.pluck(5.3+i*0.42,mf(m),0.1,1.0));y.pad(5.3,1.9,[65,69,72],0.012);
   y.breath(5.8,1.4,0.2,1.4);
   return{d,S:y.finish(6.7),chirps:[[2,1.0],[8,4.85]]}},
 function laser(){const d=7.2,y=Synth(d,SR);
   y.glide(0.2,0.12,1800,2400,0.08);
   const bars=[[0.3,[69,72,76,72,81,76,72,76],45],[1.9,[65,69,72,69,77,72,69,72],41]];
   for(const [t0,ns,root] of bars){ns.forEach((m,i)=>y.pizz(t0+i*0.2,mf(m),0.12));for(let b=0;b<4;b++)y.bass(t0+b*0.4,mf(root-12+(b%2?7:0)),0.16,0.35)}
   [67,71,74,71].forEach((m,i)=>y.pizz(3.5+i*0.1,mf(m),0.1));
   for(let t=0.6;t<3.6;t+=0.55)y.glide(t,0.1,(t*10|0)%2?2600:1500,(t*10|0)%2?1500:2600,0.04);
   for(let t=3.9,i=0;t<4.4;t+=0.05,i++)y.pizz(t,mf(64),0.03+0.006*i);y.bass(3.95,mf(33),0.2,0.3);y.bass(4.2,mf(33),0.22,0.3);
   y.noise(4.4,0.5,0.3,0.25);
   y.bass(4.95,mf(33),0.35);y.noise(4.95,0.1,0.35,0.3);
   y.glide(5.05,0.3,mf(60),mf(58),0.13,0.03);y.glide(5.4,0.5,mf(58),mf(53),0.13,0.04);
   y.pluck(5.35,mf(76),0.11,0.6);y.pluck(5.5,mf(72),0.11,0.8);
   [5.9,6.15,6.4].forEach(t=>y.pluck(t,mf(84),0.06,0.3));
   [60,64,67].forEach(m=>y.pluck(6.75,mf(m+12),0.07,0.8));
   return{d,S:y.finish(6.7),chirps:[[7,4.42],[1,6.0]]}},
 function nap(){const d=8.0,y=Synth(d,SR);
   for(let b=0;b<3;b++){const t=0.2+b*1.8,root=[48,53,55][b],ch=[[64,67],[65,69],[62,67]][b];y.bass(t,mf(root),0.14,0.8);ch.forEach(m=>{y.pluck(t+0.6,mf(m),0.05,0.8);y.pluck(t+1.2,mf(m),0.05,0.8)})}
   [[0.2,76],[1.1,79],[2.0,81],[2.9,77],[3.8,79],[4.4,74]].forEach(([t,m])=>y.pluck(t,mf(m),0.11,1.6));
   y.breath(0.2,4.9,0.22,2.86);
   [84,88,91,96].forEach((m,i)=>y.pluck(1.25+i*0.07,mf(m),0.06,0.8));
   for(let t=2.0;t<4.9;t+=0.5)y.pluck(t,mf(91+(t*2|0)%3*2),0.03,0.25);
   y.glide(5.0,0.06,700,1400,0.15);y.noise(5.0,0.04,0.25,0.9);
   y.glide(6.7,0.12,300,180,0.2);
   y.pluck(7.0,mf(88),0.09,0.8);y.pluck(7.1,mf(91),0.09,0.8);
   [65,69,72].forEach(m=>y.pluck(7.2,mf(m+12),0.06,0.8));
   return{d,S:y.finish(7.4),chirps:[[1,5.4],[8,5.95]]}},
 function rain(){const d=7.8,y=Synth(d,SR);const {DROPS,FALL}=RAIN;
   const beat=0.45;for(let i=0;i<13;i++){const t=0.1+i*beat,roots=[48,53,55,48];const r=roots[(i/4|0)%4];y.bass(t,mf(r-12+(i%2?7:0)),0.15,0.35);
     const ch=r===48?[64,67,72]:r===53?[65,69,72]:[62,67,71];if(i%2)ch.forEach(m=>y.pizz(t,mf(m),0.05))}
   [[0.1,76],[0.55,79],[1.0,84],[1.9,81],[2.35,77],[2.8,81],[3.7,79],[4.15,74],[4.6,79]].forEach(([t,m])=>y.pluck(t,mf(m),0.08,0.7));
   const coin=[79,81,84,86,88,91];
   DROPS.forEach(([t0],i)=>{y.glide(t0,FALL,1400,700,0.04);const c=t0+FALL;y.glide(c-0.3,0.2,300,520,0.05);y.glide(c,0.08,500,250,0.17);y.pluck(c+0.03,mf(coin[i]),0.12,0.7)});
   for(let t=5.9,i=0;t<6.9;t+=0.18,i++)y.pluck(t,mf(55+(i%2)*2),0.09,0.25);
   y.pluck(6.0,mf(88),0.08,0.8);[60,64,67,72].forEach(m=>y.pluck(6.9,mf(m+12),0.07,0.9));
   return{d,S:y.finish(7.2),chirps:[[4,2.2],[5,4.0],[7,5.85]]}},
];
const BUF={};let actx=null,srcs=[],cur=-1,t0=0,last=-1;
const st=m=>document.getElementById('st').textContent=m;
function ac(){if(!actx)actx=new AudioContext({sampleRate:OUT_SR});actx.resume();return actx}
async function load(){const c=new OfflineAudioContext(1,OUT_SR,OUT_SR);for(const f of'abcd'){BUF[f]=await c.decodeAudioData(await (await fetch('audios/'+f+'.ogg')).arrayBuffer())}}
function peakOf(ch){const b=BUF[ch.f],d=b.getChannelData(0),sr=b.sampleRate;let p=0;for(let i=Math.floor(ch.s*sr);i<Math.floor(ch.e*sr);i++)p=Math.max(p,Math.abs(d[i]));return p||1}
async function render(i){const s=SOUND[i](),c=new OfflineAudioContext(1,Math.round(OUT_SR*s.d),OUT_SR);
  const mb=c.createBuffer(1,s.S.length,SR);mb.copyToChannel(s.S,0);const ms=c.createBufferSource();ms.buffer=mb;const mg=c.createGain();ms.connect(mg);mg.connect(c.destination);ms.start(0);
  for(const [id,at] of s.chirps){const ch=CHIRP[id],len=ch.e-ch.s,g=c.createGain(),src=c.createBufferSource(),gain=0.62/peakOf(ch);src.buffer=BUF[ch.f];
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(gain,at+0.025);g.gain.setValueAtTime(gain,at+len-0.025);g.gain.linearRampToValueAtTime(0,at+len);src.connect(g);g.connect(c.destination);src.start(at,ch.s,len);
    mg.gain.setValueAtTime(1,at-0.05);mg.gain.linearRampToValueAtTime(0.65,at);mg.gain.setValueAtTime(0.65,at+len);mg.gain.linearRampToValueAtTime(1,at+len+0.1)}
  const r=await c.startRendering(),d=r.getChannelData(0);let pk=0;for(const v of d)pk=Math.max(pk,Math.abs(v));if(pk>0.89)for(let k=0;k<d.length;k++)d[k]*=0.89/pk;return r}
async function play(i){const c=ac();srcs.forEach(s=>{try{s.stop()}catch(e){}});srcs=[];st('mezclando…');const r=await render(i);const s=c.createBufferSource();s.buffer=r;s.connect(c.destination);s.start(c.currentTime+0.05);srcs.push(s);cur=i;last=i;t0=performance.now()+50;st(SECRETS[i].name)}
document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='r'){let n;do{n=Math.floor(Math.random()*4)}while(n===last);play(n)}else play(+a)});
// Save all four as 16 kHz mono WAV into out/ (for app/src/main/res/raw/sushitv_secreto_N.wav).
window.exportAll=async(rate=16000)=>{const res=[];for(let i=0;i<4;i++){const r=await render(i),c=new OfflineAudioContext(1,Math.round(rate*r.duration),rate),s=c.createBufferSource();s.buffer=r;s.connect(c.destination);s.start(0);const d=(await c.startRendering()).getChannelData(0);
  const buf=new ArrayBuffer(44+d.length*2),v=new DataView(buf),w=(o,x)=>[...x].forEach((ch,j)=>v.setUint8(o+j,ch.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);
  for(let k=0;k<d.length;k++)v.setInt16(44+k*2,Math.max(-1,Math.min(1,d[k]))*32767,true);
  const rr=await fetch('/save?name=sushitv_secreto_'+(i+1)+'.wav',{method:'POST',body:buf});res.push(rr.status+' '+buf.byteLength)}return res};
const cv=document.getElementById('c'),cx=cv.getContext('2d');
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*9/16*d)}
fit();addEventListener('resize',fit);
function bg(){const g=cx.createLinearGradient(0,0,1920,1080);g.addColorStop(0,'#16202a');g.addColorStop(1,'#0b0f13');cx.fillStyle=g;cx.fillRect(0,0,1920,1080);
  cx.fillStyle='#1d2a35';cx.beginPath();cx.roundRect(24,24,110,1032,30);cx.fill();for(let i=0;i<6;i++){cx.fillStyle=i==0?'#2f4a5e':'#24323e';cx.beginPath();cx.roundRect(44,120+i*110,70,70,20);cx.fill()}
  cx.fillStyle='#e8eef3';cx.font='700 46px system-ui';cx.fillText('TV chilena',190,105);cx.fillStyle='#9fb0bd';cx.font='500 26px system-ui';cx.fillText('Nacionales · Noticias · Música',190,150);
  for(let r=0;r<3;r++)for(let c=0;c<5;c++){cx.fillStyle='#22303c';cx.beginPath();cx.roundRect(190+c*340,200+r*270,310,230,22);cx.fill();cx.fillStyle='#2c3e4c';cx.beginPath();cx.roundRect(210+c*340,220+r*270,270,140,14);cx.fill();cx.fillStyle='#8da1ae';cx.fillRect(210+c*340,382+r*270,180,18)}}
function frame(now){const s=cv.width/1920;cx.setTransform(s,0,0,s,0,0);cx.globalAlpha=1;bg();
  if(cur>=0){const t=(now-t0)/1000;if(t>SECRETS[cur].d+0.3)cur=-1;else if(t>=0)drawSecret(cx,cur,t)}
  requestAnimationFrame(frame)}
load().then(()=>{st('listo: elige una');requestAnimationFrame(frame)}).catch(e=>st('ERR '+e));
</script>
